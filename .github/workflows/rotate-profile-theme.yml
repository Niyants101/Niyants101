name: Choose static profile banner

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Static teaser shown in the GitHub profile README
        required: true
        default: batman
        type: choice
        options:
          - batman
          - spider
          - random

permissions:
  contents: write

jobs:
  choose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Choose static profile teaser
        env:
          PROFILE_THEME: ${{ inputs.theme }}
        run: node scripts/rotate-profile-theme.mjs

      - name: Commit selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .profile-theme.json
          if git diff --cached --quiet; then
            echo "No profile change needed"
          else
            git commit -m "Choose static profile hero"
            git push
          fi
