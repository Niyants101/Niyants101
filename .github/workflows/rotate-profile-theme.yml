name: Rotate profile hero

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: Profile theme to show now
        required: true
        default: random
        type: choice
        options:
          - random
          - batman
          - spider

permissions:
  contents: write

concurrency:
  group: profile-hero-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Select animation and matching game
        env:
          PROFILE_THEME: ${{ github.event.inputs.theme || 'random' }}
        run: node scripts/rotate-profile-theme.mjs

      - name: Commit selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .profile-theme.json
          if git diff --cached --quiet; then
            echo "No profile change needed"
          else
            git commit -m "Rotate profile hero"
            git push
          fi
