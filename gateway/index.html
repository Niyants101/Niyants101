<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Niyant Rooftop Run</title>
  <meta name="description" content="Unlock a rooftop pursuit hidden inside Niyant's GitHub profile.">
  <script>
    (() => {
      const coordinates = location.search.slice(1).match(/^(\d+),(\d+)$/);
      if (!coordinates) return;

      const clickedX = Number(coordinates[1]);
      const clickedY = Number(coordinates[2]);
      const displayedWidth = Math.min(840, Math.max(280, window.innerWidth - 32));
      const scale = displayedWidth / 960;
      const hitSignal =
        clickedX >= 790 * scale &&
        clickedX <= 910 * scale &&
        clickedY >= 15 * scale &&
        clickedY <= 135 * scale;

      if (!hitSignal) {
        document.documentElement.style.visibility = "hidden";
        const cameFromGitHub = document.referrer.startsWith("https://github.com/");
        location.replace(cameFromGitHub ? document.referrer : "https://github.com/Niyants101");
      }
    })();
  </script>
  <style>
    :root{color-scheme:dark;--cyan:#67f5df;--green:#4dff9b;--red:#ff405d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711}body{color:#ecffff;font-family:"Courier New",ui-monospace,monospace;overflow:hidden}button,input{font:inherit}.hidden{display:none!important}
    .gate{position:relative;display:grid;min-height:100svh;place-items:center;isolation:isolate;overflow:hidden}.city{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:blur(13px) brightness(.42) saturate(.75);transform:scale(1.04);animation:breathe 8s ease-in-out infinite alternate}.veil{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 48%,transparent 0 12%,rgba(0,5,14,.52) 68%),linear-gradient(rgba(0,4,12,.35),rgba(0,3,9,.76))}.rain{position:absolute;inset:-70% -30%;z-index:2;opacity:.18;background:repeating-linear-gradient(112deg,transparent 0 34px,rgba(135,245,255,.7) 35px 36px,transparent 37px 65px);animation:rain .65s linear infinite}.terminal{position:relative;z-index:3;width:min(88vw,470px);padding:42px 44px 36px;border:1px solid rgba(103,245,223,.45);border-radius:3px;background:linear-gradient(145deg,rgba(3,12,25,.92),rgba(2,7,16,.82));box-shadow:0 0 0 1px rgba(103,245,223,.08),0 26px 90px #000b,inset 0 0 50px rgba(40,217,210,.035);backdrop-filter:blur(18px);text-align:center}.terminal:before,.terminal:after{content:"";position:absolute;width:28px;height:28px;border-color:var(--cyan);opacity:.8}.terminal:before{left:-1px;top:-1px;border-left:2px solid;border-top:2px solid}.terminal:after{right:-1px;bottom:-1px;border-right:2px solid;border-bottom:2px solid}.logo{width:84px;height:84px;object-fit:contain;margin:0 auto 18px;filter:grayscale(1) brightness(1.7) contrast(1.25) drop-shadow(0 0 14px rgba(103,245,223,.25));border-radius:50%}.terminal h1{margin:0 0 27px;font-size:clamp(23px,5vw,32px);letter-spacing:.08em}.gate-form{text-align:left}.gate-form label{display:block;margin-bottom:8px;color:#71969d;font-size:10px;letter-spacing:.22em}.code-row{display:grid;grid-template-columns:1fr auto;gap:10px}.gate-form input{min-width:0;height:54px;border:1px solid #2a6570;border-radius:2px;outline:0;background:rgba(1,8,17,.9);color:#eaffff;font-size:25px;letter-spacing:.55em;text-indent:.55em;text-align:center;transition:.2s}.gate-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(103,245,223,.1),0 0 24px rgba(103,245,223,.12)}.gate-form input::placeholder{color:#41656c}.gate button{height:54px;padding:0 19px;border:1px solid var(--cyan);border-radius:2px;background:rgba(103,245,223,.08);color:var(--cyan);font-size:11px;letter-spacing:.12em;cursor:pointer}.gate button:hover:not(:disabled){background:var(--cyan);color:#031015}.gate button:disabled{cursor:not-allowed;opacity:.32}.message{min-height:13px;margin:12px 0 0;color:#52747b;font-size:9px;letter-spacing:.2em}.gate.error .terminal{animation:shake .48s;border-color:var(--red);box-shadow:0 0 36px rgba(255,64,93,.14),0 26px 90px #000b}.gate.error input{border-color:var(--red);background:rgba(53,4,16,.45)}.gate.error .message{color:var(--red)}.gate.success .terminal{border-color:var(--green);box-shadow:0 0 55px rgba(77,255,155,.22),0 26px 90px #000b}.gate.success input,.gate.success button{border-color:var(--green);background:rgba(77,255,155,.12);color:var(--green)}.gate.success .message{color:var(--green)}.flash{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;opacity:0;background:#eaffff}.flash img{position:relative;z-index:2;width:min(44vw,310px);filter:grayscale(1) contrast(2) drop-shadow(0 0 45px white);border-radius:50%}.gate.signal .flash{animation:reveal 1.15s ease-in-out forwards}.gate.signal .terminal{animation:away .35s ease-in forwards}
    .runner{position:relative;display:grid;width:100vw;min-height:100svh;place-items:center;overflow:hidden;isolation:isolate;background:#020711;animation:fade .8s ease-out;user-select:none;touch-action:none}.runner:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.76)}.runner-canvas{display:block;width:min(100vw,calc(100svh * 1.7778));height:min(100svh,calc(100vw * .5625));background:#020711}.hud{position:fixed;inset:25px 30px auto;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;text-shadow:0 2px 16px #000}.run-title,.high-score{display:grid;gap:4px}.run-title span{font-weight:700;font-size:clamp(12px,1.4vw,18px);letter-spacing:.2em}.run-title small,.high-score small{color:#66e5d2;font-size:8px;letter-spacing:.25em}.high-score{text-align:right}.high-score strong{font-size:clamp(17px,2.2vw,28px);letter-spacing:.12em}.distance{position:fixed;left:50%;bottom:25px;z-index:4;display:flex;align-items:baseline;gap:11px;transform:translateX(-50%);pointer-events:none;color:#6d979e;font-size:8px;letter-spacing:.22em;text-shadow:0 2px 12px #000}.distance strong{color:#eaffff;font-size:clamp(17px,2vw,25px);letter-spacing:.12em}.intro-copy{position:fixed;left:50%;top:19%;z-index:4;transform:translateX(-50%);color:#70ead8;font-size:9px;letter-spacing:.38em;text-shadow:0 0 18px #62e7d2;animation:pulse 1s ease-in-out infinite alternate}.help{position:fixed;left:28px;bottom:27px;z-index:4;display:flex;gap:20px;color:rgba(159,198,203,.65);font-size:8px;letter-spacing:.12em;pointer-events:none;animation:helper 8s ease forwards}.gameover{position:fixed;left:50%;top:50%;z-index:7;width:min(88vw,430px);padding:34px 38px 31px;transform:translate(-50%,-50%);border:1px solid rgba(103,245,223,.48);background:rgba(3,10,21,.91);box-shadow:0 24px 100px #000,inset 0 0 45px rgba(55,211,197,.04);backdrop-filter:blur(14px);text-align:center;animation:gameover .42s ease-out}.gameover:before,.gameover:after{content:"";position:absolute;width:25px;height:25px;border-color:#66ead6}.gameover:before{left:-1px;top:-1px;border-left:2px solid;border-top:2px solid}.gameover:after{right:-1px;bottom:-1px;border-right:2px solid;border-bottom:2px solid}.gameover p{margin:0 0 9px;color:#ff657a;font-size:9px;letter-spacing:.28em}.gameover h1{margin:0;font-size:clamp(27px,5vw,43px);letter-spacing:.12em}.results{display:flex;justify-content:center;gap:34px;margin:22px 0;color:#6f969e;font-size:9px;letter-spacing:.15em}.results span{display:grid;gap:5px}.results strong{color:#eaffff;font-size:18px}.gameover button{width:100%;height:48px;border:1px solid #65ead6;border-radius:2px;background:rgba(101,234,214,.1);color:#70f4df;font-size:11px;letter-spacing:.12em;cursor:pointer}.gameover button:hover{background:#65ead6;color:#031015}.gameover small{display:block;margin-top:12px;color:#56767d;font-size:8px;letter-spacing:.13em}.touch-controls{position:fixed;left:50%;bottom:20px;z-index:6;display:none;grid-template-columns:46px 1fr 1fr 46px;gap:8px;width:min(92vw,410px);transform:translateX(-50%)}.touch-controls button{height:48px;padding:0 10px;border:1px solid rgba(103,245,223,.55);border-radius:2px;background:rgba(3,15,25,.78);color:#84f6e5;backdrop-filter:blur(8px)}
    @keyframes rain{to{transform:translate3d(9%,32%,0)}}@keyframes breathe{to{transform:scale(1.08) translateY(-1%)}}@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}@keyframes away{to{opacity:0;transform:scale(.92);filter:blur(9px)}}@keyframes reveal{0%{opacity:0}20%{opacity:1;background:#06121a}48%{opacity:1;background:white}78%{opacity:1;background:#06121a}100%{opacity:0}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{to{opacity:.42}}@keyframes helper{0%,65%{opacity:1}100%{opacity:.25}}@keyframes gameover{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @media(hover:none),(pointer:coarse){.runner.playing .touch-controls{display:grid}.runner.playing .distance{bottom:82px}.runner.playing .help{display:none}}@media(max-width:560px){.terminal{padding:32px 24px 28px}.code-row{grid-template-columns:1fr}.gate button{width:100%}.hud{inset:16px 16px auto}.gameover{padding:29px 24px 26px}}@media(prefers-reduced-motion:reduce){.gate *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <img class="city" src="night-shift.gif" alt=""><div class="rain"></div><div class="veil"></div>
    <section class="terminal" aria-label="Rooftop access terminal">
      <img class="logo" id="signalArt" src="bat-signal.png" alt="Bat Signal">
      <h1>IDENTITY REQUIRED</h1>
      <form class="gate-form" id="gateForm">
        <label for="code">ACCESS CODE</label>
        <div class="code-row"><input id="code" inputmode="numeric" maxlength="3" placeholder="•••" autocomplete="off"><button id="enter" disabled>ENTER</button></div>
        <p class="message" id="message" aria-live="assertive">AWAITING CREDENTIALS</p>
      </form>
    </section>
    <div class="flash"><img src="bat-signal.png" alt=""></div>
  </main>

  <main class="runner hidden" id="runner">
    <canvas class="runner-canvas" id="canvas" width="960" height="540" aria-label="Batman rooftop runner game"></canvas>
    <header class="hud"><div class="run-title"><span>ROOFTOP RUN</span><small id="phaseLabel">SWINGING IN</small></div><div class="high-score"><small>HIGH SCORE</small><strong id="highScore">000000</strong></div></header>
    <div class="distance"><span>DISTANCE</span><strong id="score">000000</strong></div>
    <div class="intro-copy" id="introCopy">ROOFTOP APPROACH</div>
    <div class="help hidden" id="help"><span>W / ↑ JUMP</span><span>S / ↓ DUCK</span><span>A D / ← → MOVE</span></div>
    <section class="gameover hidden" id="gameover" role="dialog" aria-label="Run ended"><p>MISSION INTERRUPTED</p><h1>RUN ENDED</h1><div class="results"><span>SCORE <strong id="finalScore">000000</strong></span><span>BEST <strong id="finalBest">000000</strong></span></div><button id="restart">RUN AGAIN</button><small>PRESS ENTER R OR SPACE</small></section>
    <div class="touch-controls" id="touchControls"><button data-control="left" aria-label="Move left">←</button><button data-control="jump">JUMP</button><button data-control="down">DUCK</button><button data-control="right" aria-label="Move right">→</button></div>
  </main>

  <script>
    const gate=document.querySelector('#gate');
    const runner=document.querySelector('#runner');
    const form=document.querySelector('#gateForm');
    const code=document.querySelector('#code');
    const enter=document.querySelector('#enter');
    const message=document.querySelector('#message');
    let game=null;

    code.focus();
    code.addEventListener('input',()=>{code.value=code.value.replace(/\D/g,'').slice(0,3);enter.disabled=code.value.length!==3;gate.classList.remove('error')});
    form.addEventListener('submit',event=>{
      event.preventDefault();
      if(code.value==='702'){
        gate.className='gate success';message.textContent='ACCESS GRANTED';
        setTimeout(()=>gate.className='gate signal',650);
        setTimeout(()=>{gate.classList.add('hidden');runner.classList.remove('hidden');game=new RooftopGame()},1750);
      }else{
        gate.className='gate error';message.textContent='ACCESS DENIED';
        setTimeout(()=>{code.value='';enter.disabled=true;gate.className='gate';message.textContent='AWAITING CREDENTIALS';code.focus()},650);
      }
    });

    class RooftopGame{
      constructor(){
        this.canvas=document.querySelector('#canvas');this.ctx=this.canvas.getContext('2d');
        this.scoreNode=document.querySelector('#score');this.highNode=document.querySelector('#highScore');this.phaseNode=document.querySelector('#phaseLabel');
        this.introNode=document.querySelector('#introCopy');this.helpNode=document.querySelector('#help');this.overNode=document.querySelector('#gameover');
        this.finalScoreNode=document.querySelector('#finalScore');this.finalBestNode=document.querySelector('#finalBest');
        this.controls={left:false,right:false,down:false,jump:false};this.high=Number(localStorage.getItem('niyant-rooftop-high-score')||0)||0;
        this.signal=new Image();this.signal.src='bat-signal.png';this.highNode.textContent=this.pad(this.high);
        this.bind();this.reset(false);this.previous=performance.now();this.frame=this.frame.bind(this);this.raf=requestAnimationFrame(this.frame);
      }
      pad(value){return Math.floor(value).toString().padStart(6,'0')}
      random(seed){const value=Math.sin(seed*12.9898+78.233)*43758.5453;return value-Math.floor(value)}
      clamp(value,min,max){return Math.min(max,Math.max(min,value))}
      ease(value){return value<.5?2*value*value:1-Math.pow(-2*value+2,2)/2}
      bind(){
        addEventListener('keydown',event=>{const key=event.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(key))event.preventDefault();if(this.phase==='gameover'&&['enter','r',' '].includes(key)){this.reset(true);return}if((key==='arrowup'||key==='w'||key===' ')&&!event.repeat)this.controls.jump=true;if(key==='arrowdown'||key==='s')this.controls.down=true;if(key==='arrowleft'||key==='a')this.controls.left=true;if(key==='arrowright'||key==='d')this.controls.right=true},{passive:false});
        addEventListener('keyup',event=>{const key=event.key.toLowerCase();if(key==='arrowdown'||key==='s')this.controls.down=false;if(key==='arrowleft'||key==='a')this.controls.left=false;if(key==='arrowright'||key==='d')this.controls.right=false});
        addEventListener('blur',()=>{this.controls.left=this.controls.right=this.controls.down=false});
        document.querySelector('#restart').addEventListener('click',()=>this.reset(true));
        document.querySelectorAll('[data-control]').forEach(button=>{const name=button.dataset.control;button.addEventListener('pointerdown',()=>{if(name==='jump')this.controls.jump=true;else this.controls[name]=true});['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,()=>{if(name!=='jump')this.controls[name]=false}))});
      }
      reset(skipIntro){
        this.phase=skipIntro?'playing':'intro';this.phaseNode.textContent=skipIntro?'IN PURSUIT':'SWINGING IN';runner.classList.toggle('playing',skipIntro);this.introNode.classList.toggle('hidden',skipIntro);this.helpNode.classList.toggle('hidden',!skipIntro);this.overNode.classList.add('hidden');
        this.distance=0;this.offset=0;this.elapsed=0;this.introTime=0;this.seed=6;this.coyote=.1;this.buffer=0;this.lastHud=0;
        this.player={x:180,feet:410,vy:0,grounded:true,ducking:false};
        this.platforms=[{x:-180,width:1180,y:410,color:'#13233c',seed:2}];this.obstacles=[{x:790,y:368,width:50,height:42,kind:'vent'}];this.fillWorld();this.scoreNode.textContent='000000';
      }
      setPlaying(){this.phase='playing';this.phaseNode.textContent='IN PURSUIT';runner.classList.add('playing');this.introNode.classList.add('hidden');this.helpNode.classList.remove('hidden');this.player={x:180,feet:410,vy:0,grounded:true,ducking:false}}
      end(){
        if(this.phase!=='playing')return;this.phase='gameover';runner.classList.remove('playing');this.phaseNode.textContent='RUN ENDED';this.helpNode.classList.add('hidden');
        const final=Math.floor(this.distance);if(final>this.high){this.high=final;localStorage.setItem('niyant-rooftop-high-score',String(final));this.highNode.textContent=this.pad(final)}
        this.finalScoreNode.textContent=this.pad(final);this.finalBestNode.textContent=this.pad(this.high);this.overNode.classList.remove('hidden');
      }
      addPlatform(){
        const last=this.platforms[this.platforms.length-1];const challenge=Math.min(this.distance/900,1);const gap=88+this.random(this.seed)*(46+challenge*18);const width=390+this.random(this.seed+1)*350;const y=this.clamp(last.y+(this.random(this.seed+2)-.5)*46,358,426);const x=last.x+last.width+gap;
        const colors=['#101d35','#17233d','#1d2340','#102d39','#20233a'];const platform={x,width,y,color:colors[this.seed%colors.length],seed:this.seed};this.platforms.push(platform);
        if(width>450&&this.random(this.seed+3)>.18){const ox=x+115+this.random(this.seed+4)*(width-260);if(this.random(this.seed+5)>.48)this.obstacles.push({x:ox,y:y-42,width:48,height:42,kind:'vent'});else this.obstacles.push({x:ox,y:y-66,width:94,height:18,kind:'beam'})}this.seed+=7;
      }
      fillWorld(){let last=this.platforms[this.platforms.length-1];while(last.x+last.width<1580){this.addPlatform();last=this.platforms[this.platforms.length-1]}}
      overlap(a,b){return a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y}
      update(delta){
        const speed=222+Math.min(this.distance*.075,148);this.distance+=delta*speed*.078;this.offset+=delta*speed;
        this.platforms.forEach(p=>p.x-=speed*delta);this.obstacles.forEach(o=>o.x-=speed*delta);this.platforms=this.platforms.filter(p=>p.x+p.width>-220);this.obstacles=this.obstacles.filter(o=>o.x+o.width>-100);this.fillWorld();
        this.player.x=this.clamp(this.player.x+(Number(this.controls.right)-Number(this.controls.left))*178*delta,105,355);
        const support=this.platforms.find(p=>this.player.x+12>p.x&&this.player.x-12<p.x+p.width&&Math.abs(this.player.feet-p.y)<7);if(this.player.grounded&&!support){this.player.grounded=false;this.player.vy=22}
        if(this.player.grounded)this.coyote=.105;else this.coyote=Math.max(0,this.coyote-delta);if(this.controls.jump){this.buffer=.13;this.controls.jump=false}else this.buffer=Math.max(0,this.buffer-delta);this.player.ducking=this.controls.down&&this.player.grounded;
        if(this.buffer>0&&this.coyote>0&&!this.controls.down){this.player.vy=-590;this.player.grounded=false;this.player.ducking=false;this.buffer=0;this.coyote=0}
        const previousFeet=this.player.feet;if(!this.player.grounded){this.player.vy+=(this.controls.down?1980:1580)*delta;this.player.feet+=this.player.vy*delta;if(this.player.vy>=0){const landing=this.platforms.filter(p=>this.player.x+13>p.x&&this.player.x-13<p.x+p.width&&previousFeet<=p.y+2&&this.player.feet>=p.y).sort((a,b)=>a.y-b.y)[0];if(landing){this.player.feet=landing.y;this.player.vy=0;this.player.grounded=true}}}
        const height=this.player.ducking?36:68;const box={x:this.player.x-15,y:this.player.feet-height,width:31,height};if(this.obstacles.some(o=>this.overlap(box,o))||this.player.feet>630)this.end();
        if(this.elapsed-this.lastHud>.08){this.scoreNode.textContent=this.pad(this.distance);this.lastHud=this.elapsed}
      }
      drawSky(){
        const c=this.ctx;const sky=c.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#020815');sky.addColorStop(.58,'#071225');sky.addColorStop(1,'#0c1727');c.fillStyle=sky;c.fillRect(0,0,960,540);
        c.save();c.globalAlpha=.26;const glow=c.createRadialGradient(830,92,10,830,92,100);glow.addColorStop(0,'#d8ffff');glow.addColorStop(.25,'#8ecfd0');glow.addColorStop(1,'rgba(60,130,145,0)');c.fillStyle=glow;c.fillRect(720,0,240,210);if(this.signal.complete){c.globalAlpha=.38;c.drawImage(this.signal,786,39,90,90)}c.restore();
        this.skyline(this.offset*.1,248,116,'#081326',.36,2);this.skyline(this.offset*.24,314,94,'#0b1930',.54,5);this.skyline(this.offset*.43,355,112,'#0d1d32',.72,9);
        c.save();c.strokeStyle='rgba(128,225,235,.13)';for(let i=0;i<56;i++){const x=(i*151+this.elapsed*190)%1100-70;const y=(i*83+this.elapsed*280)%640-50;c.beginPath();c.moveTo(x,y);c.lineTo(x-9,y+23);c.stroke()}c.restore();
      }
      skyline(offset,base,spacing,color,alpha,salt){
        const c=this.ctx;const shift=offset%spacing;const first=Math.floor(offset/spacing)-2;for(let column=-2;column<12;column++){const id=first+column;const width=spacing*(.72+this.random(id+salt)*.34);const height=78+this.random(id*2+salt)*150;const x=column*spacing-shift;const top=base-height;c.fillStyle=color;c.fillRect(x,top,width,540-top);if(this.random(id+salt*3)>.62)c.fillRect(x+width*.44,top-20,3,20);c.globalAlpha=alpha;for(let wy=top+20;wy<base-14;wy+=25)for(let wx=x+13;wx<x+width-10;wx+=24){const lit=this.random(id*31+wx*.07+wy*.11);if(lit>.5){c.fillStyle=lit>.78?'#52bdad':'#284769';c.fillRect(wx,wy,7,9)}}c.globalAlpha=1}
      }
      drawWorld(){
        const c=this.ctx;const lights=['#59ddb9','#6e94ea','#b184dc','#d5ad59'];this.platforms.forEach(p=>{const fill=c.createLinearGradient(p.x,p.y,p.x,540);fill.addColorStop(0,p.color);fill.addColorStop(1,'#07111f');c.fillStyle=fill;c.fillRect(p.x,p.y,p.width,540-p.y);c.fillStyle='#263750';c.fillRect(p.x,p.y,p.width,6);c.fillStyle='#07101d';c.fillRect(p.x,p.y+6,p.width,7);c.globalAlpha=.78;for(let wy=p.y+33;wy<526;wy+=30)for(let wx=p.x+19;wx<p.x+p.width-10;wx+=31){const glow=this.random(p.seed*47+wx*.13+wy*.19);if(glow>.34){c.fillStyle=lights[Math.floor(glow*10)%lights.length];c.fillRect(wx,wy,9,13)}}c.globalAlpha=1;if(p.width>520){const tx=p.x+p.width*.72;c.fillStyle='#0a1422';c.fillRect(tx,p.y-20,50,20);c.fillStyle='#263a50';c.fillRect(tx+5,p.y-25,40,5)}});
        this.obstacles.forEach(o=>{if(o.kind==='vent'){c.fillStyle='#27384b';c.fillRect(o.x,o.y+6,o.width,o.height-6);c.fillStyle='#3e5368';c.fillRect(o.x-4,o.y,o.width+8,8);c.fillStyle='#101c2a';for(let i=0;i<4;i++)c.fillRect(o.x+8,o.y+14+i*6,o.width-16,2);c.fillStyle='#e2a64c';c.fillRect(o.x+4,o.y+o.height-5,o.width-8,3)}else{c.save();c.shadowColor='#63ead7';c.shadowBlur=10;c.fillStyle='#64e8d5';c.fillRect(o.x,o.y+6,o.width,5);c.restore();c.strokeStyle='#53677f';c.lineWidth=3;c.beginPath();c.moveTo(o.x+12,o.y+6);c.lineTo(o.x+20,o.y-18);c.moveTo(o.x+o.width-12,o.y+6);c.lineTo(o.x+o.width-20,o.y-18);c.stroke();c.fillStyle='#1f3146';c.fillRect(o.x+o.width/2-12,o.y-4,24,18);c.fillStyle=Math.sin(this.elapsed*8)>0?'#ff526c':'#75283a';c.fillRect(o.x+o.width/2-3,o.y+1,6,4)}});
      }
      drawBatman(x,feet,ducking,grounded){
        const c=this.ctx;const run=grounded?Math.sin(this.elapsed*15):.25;c.save();c.translate(x,feet);
        if(ducking){c.fillStyle='rgba(5,10,21,.88)';c.beginPath();c.moveTo(-20,-28);c.quadraticCurveTo(-50,-23,-46,1);c.lineTo(16,0);c.closePath();c.fill();c.fillStyle='#111b31';c.fillRect(-15,-30,39,22);c.fillStyle='#182946';c.fillRect(7,-24,22,14);c.fillStyle='#b9a853';c.fillRect(-5,-11,28,4);c.fillStyle='#0c1729';c.beginPath();c.moveTo(-17,-29);c.lineTo(-14,-48);c.lineTo(-7,-40);c.lineTo(7,-40);c.lineTo(15,-49);c.lineTo(17,-27);c.closePath();c.fill();c.fillStyle='#9bfff1';c.fillRect(-8,-35,6,2);c.fillRect(5,-35,6,2)}else{c.fillStyle='rgba(4,9,20,.9)';c.beginPath();c.moveTo(-13,-57);c.quadraticCurveTo(-48-run*8,-43,-42,-6);c.lineTo(-24,-17);c.lineTo(-10,-8);c.closePath();c.fill();c.strokeStyle='#17243a';c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(-7,-11);c.lineTo(-10-run*9,-1);c.moveTo(8,-11);c.lineTo(13+run*9,-1);c.stroke();c.fillStyle='#17253d';c.beginPath();c.moveTo(-16,-56);c.lineTo(15,-56);c.lineTo(20,-17);c.lineTo(-17,-17);c.closePath();c.fill();c.fillStyle='#b6a34a';c.fillRect(-17,-20,37,5);c.fillStyle='#52dac3';c.fillRect(-4,-37,8,4);c.strokeStyle='#1d2e49';c.lineWidth=8;c.beginPath();c.moveTo(11,-49);c.lineTo(25+run*4,-37);c.stroke();c.fillStyle='#0b1628';c.beginPath();c.moveTo(-15,-57);c.lineTo(-12,-78);c.lineTo(-4,-68);c.lineTo(5,-68);c.lineTo(14,-79);c.lineTo(16,-55);c.lineTo(7,-49);c.lineTo(-7,-49);c.closePath();c.fill();c.fillStyle='#b6fff4';c.fillRect(-8,-62,6,2);c.fillRect(5,-62,6,2)}c.restore();
      }
      drawIntro(){
        const c=this.ctx,pivotX=300,pivotY=30,rope=262;if(this.introTime<1.7){const progress=this.ease(this.clamp(this.introTime/1.7,0,1));const angle=-1.28+progress*1.06;const x=pivotX+Math.sin(angle)*rope;const feet=pivotY+Math.cos(angle)*rope+32;c.save();c.strokeStyle='#73f2df';c.lineWidth=3;c.shadowColor='#5cf4de';c.shadowBlur=8;c.beginPath();c.moveTo(pivotX,pivotY);c.lineTo(x+21,feet-39);c.stroke();c.fillStyle='#d8ffff';c.beginPath();c.arc(pivotX,pivotY,4,0,Math.PI*2);c.fill();c.restore();this.drawBatman(x,feet,false,false)}else{const releaseX=pivotX+Math.sin(-.22)*rope;const releaseY=pivotY+Math.cos(-.22)*rope+32;const progress=this.ease(this.clamp((this.introTime-1.7)/.78,0,1));const x=releaseX+(180-releaseX)*progress;const feet=releaseY+(410-releaseY)*progress-Math.sin(progress*Math.PI)*24;const retract=this.clamp((this.introTime-1.7)/.28,0,1);if(retract<1){const hx=x+21,hy=feet-39;c.strokeStyle=`rgba(115,242,223,${1-retract})`;c.lineWidth=3;c.beginPath();c.moveTo(pivotX,pivotY);c.lineTo(hx+(pivotX-hx)*retract,hy+(pivotY-hy)*retract);c.stroke()}this.drawBatman(x,feet,false,progress>.94)}
      }
      draw(){this.ctx.clearRect(0,0,960,540);this.drawSky();this.drawWorld();if(this.phase==='intro')this.drawIntro();else this.drawBatman(this.player.x,this.player.feet,this.player.ducking,this.player.grounded);const shade=this.ctx.createLinearGradient(0,440,0,540);shade.addColorStop(0,'rgba(1,5,12,0)');shade.addColorStop(1,'rgba(1,5,12,.72)');this.ctx.fillStyle=shade;this.ctx.fillRect(0,440,960,100)}
      frame(now){const delta=Math.min((now-this.previous)/1000,.034);this.previous=now;this.elapsed+=delta;if(this.phase==='intro'){this.introTime+=delta;this.offset+=delta*18;if(this.introTime>=2.48)this.setPlaying()}else if(this.phase==='playing')this.update(delta);this.draw();this.raf=requestAnimationFrame(this.frame)}
    }
  </script>
