<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Niyant Night Shift</title>
  <meta name="description" content="Enter the Gotham access code to begin Niyant's Night Shift.">
  <style>
    :root{color-scheme:dark;--cyan:#67f5df;--green:#4dff9b;--red:#ff405d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711}body{color:#ecffff;font-family:"Courier New",monospace;overflow:hidden}button,input{font:inherit}.gate,.game{position:relative;display:grid;min-height:100svh;place-items:center;isolation:isolate;overflow:hidden}.city{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:blur(13px) brightness(.42) saturate(.75);transform:scale(1.04);animation:breathe 8s ease-in-out infinite alternate}.veil{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 48%,transparent 0 12%,rgba(0,5,14,.52) 68%),linear-gradient(rgba(0,4,12,.35),rgba(0,3,9,.76))}.rain{position:absolute;inset:-70% -30%;z-index:2;opacity:.18;background:repeating-linear-gradient(112deg,transparent 0 34px,rgba(135,245,255,.7) 35px 36px,transparent 37px 65px);animation:rain .65s linear infinite}.terminal{position:relative;z-index:3;width:min(88vw,470px);padding:42px 44px 36px;border:1px solid rgba(103,245,223,.45);border-radius:3px;background:linear-gradient(145deg,rgba(3,12,25,.92),rgba(2,7,16,.82));box-shadow:0 0 0 1px rgba(103,245,223,.08),0 26px 90px #000b;backdrop-filter:blur(18px);text-align:center}.terminal:before,.terminal:after{content:"";position:absolute;width:28px;height:28px;border-color:var(--cyan)}.terminal:before{left:-1px;top:-1px;border-left:2px solid;border-top:2px solid}.terminal:after{right:-1px;bottom:-1px;border-right:2px solid;border-bottom:2px solid}.logo{width:84px;height:84px;object-fit:contain;margin:0 auto 18px;filter:grayscale(1) brightness(1.7) contrast(1.25) drop-shadow(0 0 14px rgba(103,245,223,.25));border-radius:50%}.eyebrow{margin:0 0 10px;color:var(--cyan);font-size:11px;letter-spacing:.34em}h1{margin:0;font-size:clamp(23px,5vw,32px);letter-spacing:.08em}.instruction{margin:12px 0 27px;color:#88a8b0;font:14px Arial,sans-serif}form{text-align:left}label{display:block;margin-bottom:8px;color:#71969d;font-size:10px;letter-spacing:.22em}.row{display:grid;grid-template-columns:1fr auto;gap:10px}input{min-width:0;height:54px;border:1px solid #2a6570;border-radius:2px;outline:0;background:rgba(1,8,17,.9);color:#eaffff;font-size:25px;letter-spacing:.55em;text-indent:.55em;text-align:center;transition:.2s}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(103,245,223,.1),0 0 24px rgba(103,245,223,.12)}input::placeholder{color:#41656c}button{height:54px;padding:0 19px;border:1px solid var(--cyan);border-radius:2px;background:rgba(103,245,223,.08);color:var(--cyan);font-size:11px;letter-spacing:.12em;cursor:pointer}button:hover:not(:disabled){background:var(--cyan);color:#031015}button:disabled{cursor:not-allowed;opacity:.32}.message{min-height:13px;margin:12px 0 0;color:#52747b;font-size:9px;letter-spacing:.2em}.error .terminal{animation:shake .48s;border-color:var(--red);box-shadow:0 0 36px rgba(255,64,93,.14),0 26px 90px #000b}.error input{border-color:var(--red);background:rgba(53,4,16,.45)}.error .message{color:var(--red)}.success .terminal{border-color:var(--green);box-shadow:0 0 55px rgba(77,255,155,.22),0 26px 90px #000b}.success input,.success button{border-color:var(--green);background:rgba(77,255,155,.12);color:var(--green)}.success .message{color:var(--green)}.flash{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;opacity:0;background:#eaffff}.flash img{position:relative;z-index:2;width:min(44vw,310px);filter:grayscale(1) contrast(2) drop-shadow(0 0 45px white);border-radius:50%}.signal .flash{animation:reveal 1.15s ease-in-out forwards}.signal .terminal{animation:away .35s ease-in forwards}.game{display:none;background:#020711;animation:fade .9s ease-out}.game .city{filter:brightness(.44) saturate(.8);inset:0;width:100%;height:100%;animation:none}.mission{position:relative;z-index:2;text-align:center;text-shadow:0 0 22px #000}.mission img{width:112px;border-radius:50%;filter:grayscale(1) contrast(1.5) brightness(1.7)}.mission p{color:var(--green);font-size:10px;letter-spacing:.3em}.mission h1{font-size:clamp(30px,7vw,64px)}.mission span{display:block;margin-top:11px;color:#89a5ac;font:14px Arial,sans-serif}@keyframes rain{to{transform:translate3d(9%,32%,0)}}@keyframes breathe{to{transform:scale(1.08) translateY(-1%)}}@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}@keyframes away{to{opacity:0;transform:scale(.92);filter:blur(9px)}}@keyframes reveal{0%{opacity:0}20%{opacity:1;background:#06121a}48%{opacity:1;background:white}78%{opacity:1;background:#06121a}100%{opacity:0}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:560px){.terminal{padding:32px 24px 28px}.row{grid-template-columns:1fr}button{width:100%}}
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <img class="city" src="night-shift.gif" alt=""><div class="rain"></div><div class="veil"></div>
    <section class="terminal" aria-label="Night Shift access terminal">
      <img class="logo" src="bat-signal.png" alt="Bat Signal"><p class="eyebrow">NIYANT NIGHT SHIFT</p><h1>IDENTITY REQUIRED</h1><p class="instruction">Enter the Gotham access code</p>
      <form id="form"><label for="code">ACCESS CODE</label><div class="row"><input id="code" inputmode="numeric" maxlength="3" placeholder="•••" autocomplete="off"><button id="enter" disabled>ENTER</button></div><p class="message" id="message">AWAITING CREDENTIALS</p></form>
    </section>
    <div class="flash"><img src="bat-signal.png" alt=""></div>
  </main>
  <main class="game" id="game"><img class="city" src="night-shift.gif" alt="Gotham skyline"><section class="mission"><img src="bat-signal.png" alt="Bat Signal"><p>ACCESS GRANTED</p><h1>MISSION AWAITS</h1><span>The game begins here next</span></section></main>
  <script>
    const gate=document.querySelector('#gate'),game=document.querySelector('#game'),form=document.querySelector('#form'),code=document.querySelector('#code'),enter=document.querySelector('#enter'),message=document.querySelector('#message');
    code.focus();code.addEventListener('input',()=>{code.value=code.value.replace(/\D/g,'').slice(0,3);enter.disabled=code.value.length!==3;gate.classList.remove('error')});
    form.addEventListener('submit',event=>{event.preventDefault();if(code.value==='702'){gate.className='gate success';message.textContent='ACCESS GRANTED';setTimeout(()=>gate.className='gate signal',650);setTimeout(()=>{gate.style.display='none';game.style.display='grid'},1750)}else{gate.className='gate error';message.textContent='ACCESS DENIED';setTimeout(()=>{code.value='';enter.disabled=true;gate.className='gate';message.textContent='AWAITING CREDENTIALS';code.focus()},650)}});
  </script>
</body>
</html>
