<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Niyant Hero Signal</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #020711;
      visibility: hidden;
    }
  </style>
  <script src="signal-router.js?v=20260909-synchronized-v1"></script>
  <script>
    (() => {
      const PROFILE = "https://github.com/Niyants101";
      const destination = window.NiyantSignalRouter.destinationFromQuery(
        location.search,
        window.innerWidth,
      );
      location.replace(destination
        ? new URL(destination, location.href).href
        : PROFILE);
    })();
  </script>
</head>
<body></body>
</html>
