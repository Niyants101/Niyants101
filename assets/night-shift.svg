<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Niyant's Night Shift</title>
  <desc id="desc">A seamless animated night scene with a masked robotics vigilante swinging through a moving city while a robot companion follows.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#02040d"/><stop offset=".58" stop-color="#101a35"/><stop offset="1" stop-color="#182946"/></linearGradient>
    <radialGradient id="signal" cx="50%" cy="100%" r="100%"><stop stop-color="#dffff5" stop-opacity=".5"/><stop offset="1" stop-color="#8df5dc" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244668"/><stop offset="1" stop-color="#14263f"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="520" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: "Courier New", monospace; }
    .clouds { animation: drift 38s linear infinite; }
    .far-track { animation: scroll 28s linear infinite; }
    .mid-track { animation: scroll 18s linear infinite; }
    .near-track { animation: scroll 10s linear infinite; }
    .hero-flight { animation: flight 12s linear infinite; }
    .hero-tilt { animation: heroTilt 12s linear infinite; transform-origin: 0 20px; }
    .grapple { stroke:#91f5df; stroke-width:3; filter:url(#glow); }
    .grapple-one { animation: lineOne 12s linear infinite; }
    .grapple-two { animation: lineTwo 12s linear infinite; }
    .grapple-three { animation: lineThree 12s linear infinite; }
    .cape { animation: cape .34s ease-in-out infinite alternate; transform-origin: 0 8px; }
    .robot-travel { animation: robotTravel 12s linear infinite; }
    .robot-bob { animation: bob 1.1s ease-in-out infinite alternate; }
    .thruster { animation: thrust .2s ease-in-out infinite alternate; transform-origin: center top; }
    .scan { animation: scan 1.7s ease-in-out infinite alternate; }
    .rain-a { animation: rain .9s linear infinite; }
    .rain-b { animation: rain 1.25s linear infinite -.6s; }
    .signal-beam { animation: signalPulse 4s ease-in-out infinite; }
    .bat { animation: batPulse 4s ease-in-out infinite; transform-origin: 1010px 108px; }
    @keyframes drift { to { transform: translateX(-600px); } }
    @keyframes scroll { to { transform: translateX(-1200px); } }
    @keyframes flight {
      0% { transform:translate(-130px,190px); }
      11% { transform:translate(20px,255px); }
      22% { transform:translate(180px,315px); }
      33% { transform:translate(350px,150px); }
      34% { transform:translate(380px,160px); }
      45% { transform:translate(500px,260px); }
      55% { transform:translate(650px,315px); }
      66% { transform:translate(800px,145px); }
      67% { transform:translate(830px,155px); }
      78% { transform:translate(950px,260px); }
      88% { transform:translate(1090px,310px); }
      100% { transform:translate(1330px,145px); }
    }
    @keyframes heroTilt { 0%,34%,67% { transform:rotate(-24deg); } 22%,55%,88% { transform:rotate(4deg); } 33%,66%,100% { transform:rotate(28deg); } }
    @keyframes lineOne { 0%,31% { opacity:1; } 33%,100% { opacity:0; } }
    @keyframes lineTwo { 0%,33% { opacity:0; } 35%,64% { opacity:1; } 66%,100% { opacity:0; } }
    @keyframes lineThree { 0%,66% { opacity:0; } 68%,98% { opacity:1; } 100% { opacity:0; } }
    @keyframes cape { from { transform: skewY(-7deg) scaleX(.92); } to { transform: skewY(13deg) scaleX(1.12); } }
    @keyframes robotTravel {
      0% { transform:translate(-250px,270px); }
      11% { transform:translate(-100px,305px); }
      22% { transform:translate(60px,335px); }
      33% { transform:translate(230px,225px); }
      45% { transform:translate(380px,310px); }
      55% { transform:translate(530px,338px); }
      66% { transform:translate(680px,220px); }
      78% { transform:translate(830px,305px); }
      88% { transform:translate(970px,335px); }
      100% { transform:translate(1210px,220px); }
    }
    @keyframes bob { from { transform: translateY(-18px) rotate(-4deg); } to { transform: translateY(18px) rotate(4deg); } }
    @keyframes thrust { from { transform: scaleY(.65); opacity:.55; } to { transform: scaleY(1.2); opacity:1; } }
    @keyframes scan { from { opacity:.2; transform:scaleX(.3); } to { opacity:.85; transform:scaleX(1); } }
    @keyframes rain { from { transform: translateY(-110px); } to { transform: translateY(130px); } }
    @keyframes signalPulse { 0%,100% { opacity:.22; } 50% { opacity:.52; } }
    @keyframes batPulse { 0%,100% { opacity:.72; transform:scale(.96); } 50% { opacity:1; transform:scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="url(#sky)"/>
    <circle cx="1010" cy="106" r="90" fill="#83e6d1" opacity=".08" filter="url(#blur)"/>
    <path class="signal-beam" d="M870 430L952 110h116l91 320z" fill="url(#signal)"/>
    <ellipse cx="1010" cy="106" rx="72" ry="50" fill="#bafbe9" opacity=".12" filter="url(#blur)"/>
    <g class="bat" fill="#07101c" filter="url(#glow)"><path d="M1010 82l15 13 23-8-10 18 21 17-32-5-17 18-17-18-32 5 21-17-10-18 23 8z"/><path d="M994 104l16-22 16 22-7 17h-18z"/></g>
    <g class="clouds" fill="#51627c" opacity=".14">
      <path d="M-90 112c31-35 83-28 99 9 30-16 75 3 77 36H-90zM300 77c28-32 74-24 90 8 29-15 69 3 71 33H300zM710 140c30-37 83-27 96 11 35-18 79 3 80 37H710zM1110 66c30-32 75-24 91 8 30-15 70 3 72 33h-163zM1310 112c31-35 83-28 99 9 30-16 75 3 77 36h-176zM1700 77c28-32 74-24 90 8 29-15 69 3 71 33h-161z"/>
    </g>
    <g class="far-track" fill="#17223b" opacity=".72">
      <path d="M0 300V204h92v96h38V154h76v146h47V221h95v79h39V178h108v122h52V129h84v171h43V209h112v91h46V164h94v136h45V197h119v103h100v220H0z"/>
      <path d="M1200 300V204h92v96h38V154h76v146h47V221h95v79h39V178h108v122h52V129h84v171h43V209h112v91h46V164h94v136h45V197h119v103h100v220H1200z"/>
    </g>
    <g class="mid-track">
      <g transform="translate(0)">
        <path d="M0 370V252h124v118h45V189h128v181h42V235h104v135h52V148h137v222h46V215h114v155h53V172h129v198h48V243h151v127h51v150H0z" fill="#0a1224"/>
        <g fill="url(#glass)" stroke="#315371" stroke-width="2"><path d="M183 205h99v151h-99zM511 165h105v189H511zM839 189h99v166h-99z"/></g>
        <g fill="#6ce8c7" opacity=".5"><path d="M195 220h17v25h-17zm29 0h17v25h-17zm29 0h17v25h-17zm-58 40h17v25h-17zm58 0h17v25h-17zM527 184h18v27h-18zm31 0h18v27h-18zm31 0h18v27h-18zm-62 43h18v27h-18zm31 0h18v27h-18zm31 0h18v27h-18zM854 205h18v26h-18zm31 0h18v26h-18zm31 0h18v26h-18zm-62 42h18v26h-18zm62 0h18v26h-18z"/></g>
        <g fill="#21324d"><path d="M68 271h20v34H68zm307-11h20v34h-20zm339-22h20v34h-20zm355 29h20v34h-20z"/></g>
      </g>
      <g transform="translate(1200)">
        <path d="M0 370V252h124v118h45V189h128v181h42V235h104v135h52V148h137v222h46V215h114v155h53V172h129v198h48V243h151v127h51v150H0z" fill="#0a1224"/>
        <g fill="url(#glass)" stroke="#315371" stroke-width="2"><path d="M183 205h99v151h-99zM511 165h105v189H511zM839 189h99v166h-99z"/></g>
        <g fill="#6ce8c7" opacity=".5"><path d="M195 220h17v25h-17zm29 0h17v25h-17zm29 0h17v25h-17zm-58 40h17v25h-17zm58 0h17v25h-17zM527 184h18v27h-18zm31 0h18v27h-18zm31 0h18v27h-18zm-62 43h18v27h-18zm31 0h18v27h-18zm31 0h18v27h-18zM854 205h18v26h-18zm31 0h18v26h-18zm31 0h18v26h-18zm-62 42h18v26h-18zm62 0h18v26h-18z"/></g>
      </g>
    </g>
    <g opacity=".34" stroke="#8adacb" stroke-width="2">
      <g class="rain-a"><path d="M40 20l-10 30m92-12l-10 30m92-64l-10 30m92 18l-10 30m92-63l-10 30m92 7l-10 30m92-56l-10 30m92 18l-10 30m92-74l-10 30m92 23l-10 30m92-60l-10 30m92 11l-10 30m92-65l-10 30"/></g>
      <g class="rain-b"><path d="M78 90l-8 24m111-64l-8 24m111 20l-8 24m111-72l-8 24m111 8l-8 24m111-57l-8 24m111 18l-8 24m111-69l-8 24m111 11l-8 24m111-55l-8 24m111 7l-8 24"/></g>
    </g>
    <g aria-label="Moving grapple lines">
      <line class="grapple grapple-one" x1="350" y1="42" x2="500" y2="250">
        <animate attributeName="x2" dur="12s" repeatCount="indefinite" values="-130;20;180;350;380;500;650;800;830;950;1090;1330" keyTimes="0;.11;.22;.33;.34;.45;.55;.66;.67;.78;.88;1"/>
        <animate attributeName="y2" dur="12s" repeatCount="indefinite" values="190;255;315;150;160;260;315;145;155;260;310;145" keyTimes="0;.11;.22;.33;.34;.45;.55;.66;.67;.78;.88;1"/>
      </line>
      <line class="grapple grapple-two" x1="800" y1="36" x2="500" y2="250" opacity="0">
        <animate attributeName="x2" dur="12s" repeatCount="indefinite" values="-130;20;180;350;380;500;650;800;830;950;1090;1330" keyTimes="0;.11;.22;.33;.34;.45;.55;.66;.67;.78;.88;1"/>
        <animate attributeName="y2" dur="12s" repeatCount="indefinite" values="190;255;315;150;160;260;315;145;155;260;310;145" keyTimes="0;.11;.22;.33;.34;.45;.55;.66;.67;.78;.88;1"/>
      </line>
      <line class="grapple grapple-three" x1="1250" y1="44" x2="500" y2="250" opacity="0">
        <animate attributeName="x2" dur="12s" repeatCount="indefinite" values="-130;20;180;350;380;500;650;800;830;950;1090;1330" keyTimes="0;.11;.22;.33;.34;.45;.55;.66;.67;.78;.88;1"/>
        <animate attributeName="y2" dur="12s" repeatCount="indefinite" values="190;255;315;150;160;260;315;145;155;260;310;145" keyTimes="0;.11;.22;.33;.34;.45;.55;.66;.67;.78;.88;1"/>
      </line>
    </g>
    <g class="hero-flight" transform="translate(500 250)"><g class="hero-tilt">
      <g>
        <path class="cape" d="M-18 25c-34 20-45 62-37 94l56-30 17-57z" fill="#0a1020" stroke="#39526d" stroke-width="3"/>
        <path d="M-23-6l14-25L0-15 11-31 25-6l-5 42h-39z" fill="#121d32" stroke="#75f0d1" stroke-width="3"/>
        <path d="M-14 7l11 4-11 6zm28 0L3 11l11 6z" fill="#e5fff9"/>
        <path d="M-17 36h36l10 65-29 22-29-22z" fill="#192943" stroke="#4d7288" stroke-width="3"/>
        <path d="M-10 50h20v14h-20z" fill="#70f0bd"/><path d="M-6 54h12v6H-6z" fill="#0a1220"/>
        <path d="M-18 44l-32 35 10 10L-7 61m25-17l31 22-8 12-34-19" fill="none" stroke="#192943" stroke-width="12"/>
        <path d="M-14 99l-14 42m42-42l15 42" stroke="#192943" stroke-width="14"/><path d="M-37 142h19m37 0h20" stroke="#70f0bd" stroke-width="5"/>
      </g>
    </g></g>
    <g class="robot-travel" transform="translate(385 250)"><g class="robot-bob">
      <path class="scan" d="M30 20l58-24v48z" fill="#70f0bd" opacity=".25"/><path d="M0 10V-8m-6 0H6" stroke="#70f0bd" stroke-width="4"/>
      <rect x="-28" y="10" width="58" height="46" rx="10" fill="#263b55" stroke="#70f0bd" stroke-width="3"/><rect x="-18" y="22" width="38" height="20" rx="5" fill="#050b16"/>
      <circle cx="-8" cy="32" r="4" fill="#8ffff0"/><circle cx="10" cy="32" r="4" fill="#8ffff0"/><path d="M-28 29h-15m73 0h15" stroke="#54798d" stroke-width="7"/>
      <g class="thruster" fill="#70f0bd" filter="url(#glow)"><path d="M-18 56l7 26 7-26zm23 0l7 26 7-26z"/></g>
    </g></g>
