      <g fill="#030712"><path d="M0 450h92l26-32h190l20 32h180l31-46h211l22 46h180l25-28h193v98H0z"/><path d="M1200 450h92l26-32h190l20 32h180l31-46h211l22 46h180l25-28h193v98H1200z"/></g>
      <g stroke="#213650" stroke-width="5"><path d="M118 418v-62m14 62v-62m407 48v-71m15 71v-71m633 89v-62m14 62v-62m407 48v-71m15 71v-71"/></g>
